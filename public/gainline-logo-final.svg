<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!--
    GAINLINE — Social avatar / profile picture
    400x400, dark background, bars centred
  -->
  <rect width="400" height="400" fill="#0f1e2e"/>

  <!-- Bars centred in canvas, baseline y=260, cap y=140 -->
  <!-- Bar 1: short -->
  <rect x="118" y="222" width="36" height="52"  rx="7"
        fill="#455060" transform="rotate(12 136 274)"/>
  <!-- Bar 2: mid -->
  <rect x="166" y="192" width="36" height="82"  rx="7"
        fill="#5a6a7a" transform="rotate(12 184 274)"/>
  <!-- Bar 3: tall green -->
  <rect x="214" y="154" width="36" height="120" rx="7"
        fill="#2ec97e" transform="rotate(12 232 274)"/>
</svg>
