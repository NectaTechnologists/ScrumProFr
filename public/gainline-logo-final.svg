<svg width="240" height="60" viewBox="0 0 240 60" xmlns="http://www.w3.org/2000/svg">
  <!--
    GAINLINE — Horizontal nav lockup
    NO background rectangle — transparent
    Tighter viewBox so mark fills the rendered size
    Bars + "Gainline" wordmark
  -->

  <!-- Bar 1: short -->
  <rect x="4"  y="34" width="10" height="16" rx="2"
        fill="#455060" transform="rotate(12 9 50)"/>
  <!-- Bar 2: mid -->
  <rect x="18" y="24" width="10" height="26" rx="2"
        fill="#5a6a7a" transform="rotate(12 23 50)"/>
  <!-- Bar 3: tall green -->
  <rect x="32" y="10" width="10" height="40" rx="2"
        fill="#2ec97e" transform="rotate(12 37 50)"/>

  <!-- Wordmark -->
  <text y="50"
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="46"
        font-weight="600"
        letter-spacing="0.01em">
    <tspan x="52" fill="#ffffff">Gain</tspan><tspan fill="#2ec97e">line</tspan>
  </text>
</svg>
