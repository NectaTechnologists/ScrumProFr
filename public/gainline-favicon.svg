<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!--
    GAINLINE — Favicon / Icon mark only
    64x64, transparent background
    Three bars, 12deg tilt, anchored to baseline
  -->

  <!-- Bar 1: short -->
  <rect x="8"  y="38" width="11" height="16" rx="2.5"
        fill="#455060" transform="rotate(12 13.5 54)"/>
  <!-- Bar 2: mid -->
  <rect x="24" y="28" width="11" height="26" rx="2.5"
        fill="#5a6a7a" transform="rotate(12 29.5 54)"/>
  <!-- Bar 3: tall green -->
  <rect x="40" y="14" width="11" height="40" rx="2.5"
        fill="#2ec97e" transform="rotate(12 45.5 54)"/>
</svg>
